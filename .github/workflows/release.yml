name: Release

# A release is cut by changing the version on main. Installed copies poll releases/latest and
# stage the tag it names, so the tag and the release must both exist for an update to reach
# anyone. workflow_dispatch re-runs the same path, which is how a run that failed after tagging
# is retried.
on:
  push:
    branches: [main]
    paths:
      - plugins/armorcopilot/package.json
      - plugins/armorcopilot/.claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - .agents/plugins/marketplace.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the version and look for an existing release
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/check-version.mjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          released=false
          if gh release view "v$version" >/dev/null 2>&1; then released=true; fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          if [ "$released" = true ]; then
            echo "v$version is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the version did not move during the run
        run: |
          checked=$(node scripts/check-version.mjs)
          if [ "$checked" != "$VERSION" ]; then
            echo "the version moved during the run: $checked is not $VERSION"
            exit 1
          fi

      - name: Install dependencies
        working-directory: plugins/armorcopilot
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Test
        working-directory: plugins/armorcopilot
        run: node --test

      # The tag is immutable: created once and never moved. A tag left by a failed run is reused
      # only when it already points at this commit, so the run can be retried.
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            tagged=$(git rev-parse "v$VERSION^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "tag v$VERSION points at $tagged, not $GITHUB_SHA; refusing to move it"
              exit 1
            fi
            echo "tag v$VERSION already points at this commit; reusing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A prerelease must not become releases/latest, which every installed copy follows.
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" "${prerelease[@]}" --title "v$VERSION" --verify-tag --generate-notes
